<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeerBuddy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230e1628'/%3E%3Cpath d='M8 20 L16 9 L24 20 Z M8 20 L24 20' stroke='%232dd4bf' stroke-width='1.6' fill='none'/%3E%3Ccircle cx='16' cy='9' r='3' fill='%232dd4bf'/%3E%3Ccircle cx='8' cy='20' r='3' fill='%237c8cf8'/%3E%3Ccircle cx='24' cy='20' r='3' fill='%237c8cf8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M8 21 L16 9 L24 21 Z M8 21 L24 21" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".8"/>
      <circle cx="16" cy="9" r="3.2" fill="currentColor"/>
      <circle cx="8" cy="21" r="3.2" fill="var(--accent-2)"/>
      <circle cx="24" cy="21" r="3.2" fill="var(--accent-2)"/>
    </svg>
    <div class="brand-text">
      <span class="brand-name">PeerBuddy</span>
      <span class="brand-tag">Prysm peer connectivity &amp; scoring</span>
    </div>
  </div>

  <form class="node-form" id="nodeForm" autocomplete="off">
    <label for="nodeUrl">Node</label>
    <input id="nodeUrl" class="input mono" type="text" spellcheck="false" placeholder="http://localhost:3500">
    <button class="btn" type="submit">Connect</button>
  </form>

  <div class="status" id="status">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">Connecting…</span>
  </div>

  <div class="actions">
    <button class="btn primary" id="refreshBtn" type="button">
      <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M4 10a6 6 0 0 1 10.3-4.2M16 10a6 6 0 0 1-10.3 4.2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M14 2v4h-4M6 18v-4h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Refresh Peers
    </button>
    <label class="switch" title="Poll the node every 10 seconds">
      <input type="checkbox" id="autoRefresh" checked>
      <span class="switch-track"></span>
      <span class="switch-label">Auto 10s</span>
    </label>
    <button class="btn icon" id="themeBtn" type="button" title="Toggle light / dark theme" aria-label="Toggle theme">◐</button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Views">
  <button class="tab" data-view="overview">Overview</button>
  <button class="tab" data-view="peers">Peers <span class="tab-count" data-count="peers"></span></button>
  <button class="tab" data-view="agents">Agents <span class="tab-count" data-count="agents"></span></button>
  <button class="tab" data-view="gossip">Gossip rejections <span class="tab-count" data-count="gossip"></span></button>
  <button class="tab" data-view="chain">Chain state</button>
</nav>

<div class="banner" id="banner" hidden></div>

<main id="main" class="main"></main>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Peer details"></aside>

<script src="app.js"></script>
</body>
</html>
