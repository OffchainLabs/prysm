name: Check log.go files
on: [ pull_request ]

jobs:
  check-logs:
    runs-on: ubuntu-4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check log.go files
        run: ./hack/check-logs.sh
