version: "2"
run:
  go: 1.23.5
linters:
  enable:
    - copyloopvar
    - errcheck
    - ineffassign
    - govet
    - unparam
    - unused
  disable:
    - staticcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Unused ctx params are kept for tracing and future cancellation.
      - linters:
          - unparam
        text: "(ctx|cliCtx) is unused"
      # Anonymous funcs often have a signature fixed by a map or field type.
      - linters:
          - unparam
        text: '\$[0-9]+ - '
      # Test helpers and dev tools are out of scope.
      - linters:
          - unparam
        path: ^(testing|tools)/
    paths:
      - validator/web/site_data.go
      - .*_test.go
      - proto
      - tools/analyzers
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - validator/web/site_data.go
      - proto
      - tools/analyzers
      - third_party$
      - builtin$
      - examples$
