syntax = "proto3";

package ethereum.eth.v1alpha1;

import "proto/eth/ext/options.proto";

option go_package = "github.com/OffchainLabs/prysm/v7/proto/prysm/v1alpha1;eth";

// =============================================================================
// Gloas Builder-API (ePBS) types
// =============================================================================
// Types for the staked Builder-API used by a proposer to request bids from,
// authenticate to, and submit preferences to an external builder.
// Reference: https://github.com/ethereum/builder-specs/pull/138

// RequestAuthV1 authenticates a proposer's bid request to a specific builder.
message RequestAuthV1 {
  // Opaque auth data agreed with the builder out of band (builder-specs 5078eab);
  // the ByteList[4096] limit feeds the hash tree root and thus the signature.
  bytes data = 1 [ (ethereum.eth.ext.ssz_max) = "4096" ];
  uint64 slot = 2 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Slot"
  ];
}

message SignedRequestAuthV1 {
  RequestAuthV1 message = 1;
  bytes signature = 2 [ (ethereum.eth.ext.ssz_size) = "96" ];
}

// BuilderPreferencesV1 communicates a proposer's per-builder preferences.
message BuilderPreferencesV1 {
  uint64 max_execution_payment = 1 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Gwei"
  ];
}

message BuilderPreferencesRequestV1 {
  BuilderPreferencesV1 preferences = 1;
  SignedRequestAuthV1 auth = 2;
}

// SubmitBuilderPreferencesRequest forwards a proposer's signed preferences to
// one builder ahead of a proposal slot; url is explicit, the auth data is opaque.
message SubmitBuilderPreferencesRequest {
  bytes validator_pubkey = 1;
  string url = 2;
  BuilderPreferencesRequestV1 request = 3;
}

// BuilderPreferenceV1 is one builder's preferences for a single proposal, carried
// inline on the block request. min_bid and builder_boost_factor never leave the node.
message BuilderPreferenceV1 {
  BuilderPreferencesRequestV1 request = 1;
  optional uint64 min_bid = 2 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Gwei"
  ];
  optional uint64 builder_boost_factor = 3;
  // The signed auth data is opaque, so the builder URL is carried explicitly.
  string url = 4;
  // When set, only bids signed by this builder key are accepted from this url.
  bytes pubkey = 5;
}

// ProduceBuilderEntryV1 is the SSZ-encodable form of one produceBlockV4 builder
// entry; absent optionals collapse to sentinels (min_bid 0, boost 100, zero pubkey).
message ProduceBuilderEntryV1 {
  bytes url = 1 [ (ethereum.eth.ext.ssz_max) = "2048" ];
  BuilderPreferencesRequestV1 request = 2;
  uint64 min_bid = 3 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Gwei"
  ];
  uint64 builder_boost_factor = 4;
  bytes pubkey = 5 [ (ethereum.eth.ext.ssz_size) = "48" ];
}

message ProduceBuilderEntryListV1 {
  repeated ProduceBuilderEntryV1 entries = 1
      [ (ethereum.eth.ext.ssz_max) = "256" ];
}
