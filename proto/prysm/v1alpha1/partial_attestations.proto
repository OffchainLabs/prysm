syntax = "proto3";

package ethereum.eth.v1alpha1;

import "proto/eth/ext/options.proto";
import "proto/prysm/v1alpha1/attestation.proto";

option go_package = "github.com/OffchainLabs/prysm/v7/proto/prysm/v1alpha1;eth";

// The containers below are defined by the bundled attestation propagation
// spec (EIP draft). They are exchanged as opaque payloads over the gossipsub
// partial-messages extension on the beacon_attestation subnets and never
// pass through the gossip topic mappings.

// AttestationBundle carries attestations of one committee that share the
// same AttestationData. AttesterIndices are global validator indices;
// Signatures[i] is the signature of the validator AttesterIndices[i].
message AttestationBundle {
  uint64 committee_index = 1 [ (ethereum.eth.ext.cast_type) =
                                 "github.com/OffchainLabs/prysm/v7/"
                                 "consensus-types/primitives.CommitteeIndex" ];
  AttestationData attestation_data = 2;
  repeated uint64 attester_indices = 3 [ (ethereum.eth.ext.ssz_max) = "2048" ];
  repeated bytes signatures = 4 [
    (ethereum.eth.ext.ssz_size) = "?,96",
    (ethereum.eth.ext.ssz_max) = "2048"
  ];
}

// CommitteeAttestationPartsMetadata advertises which validators of a
// committee the sender holds attestations for (available) and which it wants
// from the peer (requests), by global validator index. The slot is the
// partial-messages group ID; a validator attests at most once per slot, so
// no attestation data is needed to identify an attestation.
message CommitteeAttestationPartsMetadata {
  uint64 committee_index = 1 [ (ethereum.eth.ext.cast_type) =
                                 "github.com/OffchainLabs/prysm/v7/"
                                 "consensus-types/primitives.CommitteeIndex" ];
  repeated uint64 available = 2 [ (ethereum.eth.ext.ssz_max) = "2048" ];
  repeated uint64 requests = 3 [ (ethereum.eth.ext.ssz_max) = "2048" ];
}
