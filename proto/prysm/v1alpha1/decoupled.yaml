package: "github.com/OffchainLabs/prysm/v7/proto/prysm/v1alpha1"
types:
  - name: "AvailableAttestationData"
  - name: "AvailableAttestation"
  - name: "CheckpointDecoupled"
  - name: "AttestationDataDecoupled"
  - name: "AttestationDecoupled"
    progressive: {}
    fields:
      AggregationBits: {type: "ProgressiveBitlist"}
  - name: "IndexedAttestationDecoupled"
    progressive: {}
    fields:
      AttestingIndices: {type: "ProgressiveList"}
  - name: "AttesterSlashingDecoupled"
  - name: "AggregateAttestationAndProofDecoupled"
  - name: "SignedAggregateAttestationAndProofDecoupled"
  - name: "SingleAttestationDecoupled"
  - name: "AvailableCommittee"
  - name: "BuilderPendingPaymentDecoupled"
  - name: "BeaconStateDecoupled"
    progressive: {}
    fields:
      Validators:                 {type: "ProgressiveList"}
      Balances:                   {type: "ProgressiveList"}
      PreviousRoundParticipation: {type: "ProgressiveList"}
      CurrentRoundParticipation:  {type: "ProgressiveList"}
      InactivityScores:           {type: "ProgressiveList"}
      PendingDeposits:            {type: "ProgressiveList"}
      PendingPartialWithdrawals:  {type: "ProgressiveList"}
      PendingConsolidations:      {type: "ProgressiveList"}
      Builders:                   {type: "ProgressiveList"}
      BuilderPendingWithdrawals:  {type: "ProgressiveList"}
      PayloadExpectedWithdrawals: {type: "ProgressiveList"}
      TargetParticipation:        {type: "ProgressiveBitlist"}
      Progress:                   {type: "ProgressiveBitlist"}
      FinalityParticipation:      {type: "ProgressiveBitlist"}
