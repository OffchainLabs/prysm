        package: github.com/OffchainLabs/prysm/v7/proto/engine/v1
      - name: ExecutionRequests
        package: github.com/OffchainLabs/prysm/v7/proto/engine/v1
      - name: IndexedAttestation
        type_name: IndexedAttestationElectra
      - name: LightClientBootstrap
        type_name: LightClientBootstrapElectra
      - name: LightClientFinalityUpdate
        type_name: LightClientFinalityUpdateElectra
      - name: LightClientUpdate
        type_name: LightClientUpdateElectra
      - name: PendingConsolidation
      - name: PendingDeposit
      - name: PendingPartialWithdrawal
      - name: SignedAggregateAndProof
        type_name: SignedAggregateAttestationAndProofElectra
      - name: SignedBeaconBlock
        type_name: SignedBeaconBlockElectra
      - name: SingleAttestation
      - name: WithdrawalRequest
        package: github.com/OffchainLabs/prysm/v7/proto/engine/v1
  - fork: fulu
    types:
      - name: BeaconState
        type_name: BeaconStateFulu
      - name: DataColumnSidecar
      - name: DataColumnsByRootIdentifier
