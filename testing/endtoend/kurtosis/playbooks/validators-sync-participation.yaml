# Check whether the sync committee participation of the head block is above a threshold (95%) on every epoch.

# Replaces those evaluators from legacy E2E:
# - ValidatorSyncParticipation

id: validator-sync-participation
name: "Validator sync committee participation check"
timeout: 60m

tasks:
  - name: check_clients_are_healthy
    id: clients
    title: "Wait for a ready consensus client"
    timeout: 5m
    config:
      minClientCount: 1

  - name: get_consensus_specs
    id: specs
    title: "Get consensus specs"

  - name: check_consensus_slot_range
    title: "Wait for two epochs"
    timeout: 20m
    config:
      minEpochNumber: 2

  - name: check_clients_are_healthy
    id: clients
    title: "Wait again for a ready consensus client"
    timeout: 5m
    config:
      minClientCount: 1

  - name: run_javascript
    title: "Scan current and previous epoch: sync participation >= floor(95%)"
    timeout: 60m
    config:
      envVars:
        CL_URL: "| .tasks.clients.outputs.goodClients[0].clRpcUrl"
        SPECS: "tasks.specs.outputs.specs"
      script: |
        const clUrl = env.CL_URL;
        const spec = env.SPECS;
        if (!spec || spec.SLOTS_PER_EPOCH === undefined) {
          throw new Error("SPECS not resolved from get_consensus_specs: " + JSON.stringify(spec));
        }

        const slotsPerEpoch = num(spec.SLOTS_PER_EPOCH, "SLOTS_PER_EPOCH");
        const altairEpoch = num(spec.ALTAIR_FORK_EPOCH, "ALTAIR_FORK_EPOCH");

        // Slots to skip: first two slots of every scheduled fork epoch (transition dips).
        const forkKeys = ["ALTAIR_FORK_EPOCH","BELLATRIX_FORK_EPOCH","CAPELLA_FORK_EPOCH","DENEB_FORK_EPOCH","ELECTRA_FORK_EPOCH","FULU_FORK_EPOCH", "GLOAS_FORK_EPOCH"];
        const skip = new Set();
        for (const k of forkKeys) {
          if (spec[k] === undefined) continue;
          const ep = Number(spec[k]);
          if (!Number.isFinite(ep) || ep > 1e12) continue; // unscheduled (far-future) fork
          const fs = ep * slotsPerEpoch;
          skip.add(fs); skip.add(fs + 1);
        }

        // Limit the number of epochs to scan.
        const maxEpoch = 20;

        let head = await getJson(clUrl + "/eth/v2/beacon/blocks/head");
        let headSlot = num(head.data.message.slot, "head slot");
        const currentEpoch = Math.floor(headSlot / slotsPerEpoch);


        for (let ep = currentEpoch; ep <= maxEpoch; ep++) {
          const previousEpoch = ep >= 1 ? ep - 1 : 0;
          const firstEpoch = Math.max(previousEpoch, altairEpoch);
          const startSlot = Math.max(3, firstEpoch * slotsPerEpoch);

          let checked = 0;

          for (let slot = startSlot; slot <= headSlot; slot++) {
            if (slot < 3 || skip.has(slot)) continue;
            const resp = await fetch(clUrl + "/eth/v2/beacon/blocks/" + slot);
            if (resp.status === 404) continue; // empty/missed slot
            if (!resp.ok) throw new Error(`GET block ${slot} -> HTTP ${resp.status}`);

            const agg = JSON.parse(await resp.text()).data.message.body.sync_aggregate;
            if (!agg) continue; // pre-altair block

            // Calculate count and compare with threshold.
            const total = bitLen(agg.sync_committee_bits);
            const count = popcount(agg.sync_committee_bits);
            const threshold = Math.floor(total * 0.95);
            if (count < threshold) {
              throw new Error(`slot ${slot}: sync participation ${count}/${total} < floor(0.95)=${threshold}`);
            }
            checked++;
          }

          console.log(`sync participation ok across ${checked} blocks from epochs ${firstEpoch}-${ep}`);

          // Wait for the next epoch to be produced before checking again.
          const nextEpoch = ep + 1;
          const nextEpochSlot = nextEpoch * slotsPerEpoch;
          while (headSlot < nextEpochSlot) {
            head = await getJson(clUrl + "/eth/v2/beacon/blocks/head");
            headSlot = num(head.data.message.slot, "head slot");
            if (headSlot < nextEpochSlot) {
              console.log(`waiting for next epoch ${nextEpoch} (slot ${nextEpochSlot}), current head slot ${headSlot}`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
          } 
        }



        // Helper functions

        async function getJson(url) {
          const r = await fetch(url);
          if (!r.ok) throw new Error(`GET ${url} -> HTTP ${r.status}`);
          return JSON.parse(await r.text());
        }
        function bitLen(hex) { return hex.replace(/^0x/, "").length * 4; }
        function popcount(hex) {
          let ones = 0;
          for (const ch of hex.replace(/^0x/, "")) {
            const n = parseInt(ch, 16);
            ones += (n & 1) + ((n >> 1) & 1) + ((n >> 2) & 1) + ((n >> 3) & 1);
          }
          return ones;
        }
        function num(v, name) {
          const n = typeof v === "number" ? v : Number(v);
          if (!Number.isFinite(n)) throw new Error(`invalid ${name}: ${JSON.stringify(v)}`);
          return n;
        }
