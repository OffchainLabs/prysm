# One-shot attestation stats check for scenario windows.
#
# Replaces one epoch worth of this legacy evaluator:
# - ValidatorsParticipatingAtEpoch
#
# NOTE: `check_consensus_attestation_stats` starts from the next epoch after this
# playbook begins, so schedule this one epoch BEFORE the epoch being checked.

id: attestation-stats-once
name: "Consensus attestation stats one-shot"
timeout: 60m

config:
  targetEpoch: 0

tasks:
  - name: check_clients_are_healthy
    title: "Check if at least one client is ready"
    timeout: 5m
    config:
      minClientCount: 1

  - name: get_consensus_specs
    id: specs
    title: "Get consensus specs"

  - name: check_consensus_slot_range
    title: "Wait for target epoch"
    timeout: 50m
    configVars:
      minEpochNumber: "| .targetEpoch | tonumber"

  - name: check_consensus_attestation_stats
    title: "Attestation quality"
    timeout: 30m
    config:
      minHeadPercent: 80
      failOnCheckMiss: true
      minCheckedEpochs: 1
    configVars:
      # Note: At Electra fork, the target participation drops to ~85%, so relax to 82% there.
      # If a network starts from Electra, then strictly check for 98% participation.
      minTargetPercent: "| if (.tasks.specs.outputs.specs.ELECTRA_FORK_EPOCH | tonumber) == 0 then 98 else 82 end"
